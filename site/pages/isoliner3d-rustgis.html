<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title"></title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap');
:root{
  --paper:#F1F3EE; --paper-2:#E7EBE3; --ink:#16221F; --ink-soft:#4C5A55;
  --teal:#0E7C66; --teal-deep:#0A5446; --amber:#C2622C;
  --line:rgba(22,34,31,.14); --r:14px; --maxw:1080px;
  --display:'Bitter',Georgia,serif;
  --body:'Golos Text','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;
  letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal-deep);margin-bottom:18px;
  display:inline-flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--amber);
  display:inline-block}
.hdr{position:sticky;top:0;z-index:20;background:rgba(241,243,238,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;
  height:62px;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px;
  font-family:var(--display);font-weight:700;text-decoration:none;
  font-size:20px}
.brand span{font-family:var(--body);font-weight:500;font-size:13px;
  color:var(--ink-soft)}
.right{display:flex;align-items:center;gap:22px}
.nav{display:flex;gap:22px;font-size:15px}
.nav a{text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--teal-deep)}
@media(max-width:860px){.nav{display:none}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;font-size:13px;font-weight:600}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;
  font:inherit;color:var(--ink-soft)}
.lang button.on{background:var(--teal);color:#fff}
.hero{padding:74px 0 48px}
.hero h1{font-size:clamp(34px,5vw,56px);max-width:18ch}
.hero .lead{margin-top:22px;font-size:20px;max-width:64ch;
  color:var(--ink-soft)}
.cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:var(--r);
  text-decoration:none;font-weight:600;font-size:16px}
.btn-main{background:var(--teal);color:#fff}
.btn-main:hover{background:var(--teal-deep)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal)}
.note{margin-top:12px;font-size:14px;color:var(--ink-soft);max-width:64ch}
section{padding:56px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,3.3vw,38px);max-width:24ch}
section .sub{margin-top:16px;max-width:70ch;color:var(--ink-soft)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:34px}
.duo{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;
  margin-top:34px}
@media(max-width:860px){.trio,.duo{grid-template-columns:1fr}}
.card{background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 24px;display:block;
  text-decoration:none}
a.card:hover{border-color:var(--teal)}
.card .eyebrow{margin-bottom:10px}
.card h3{font-size:19px;margin-bottom:10px}
.card p{color:var(--ink-soft);font-size:16px}
.tag{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;
  color:var(--amber)}
figure{margin:30px 0 0}
figure img{width:100%;height:auto;display:block;border-radius:var(--r);
  border:1px solid var(--line);background:#fff}
.shot{margin-top:38px;max-width:820px}
figcaption{margin-top:10px;font-size:14px;color:var(--ink-soft)}
.rows{margin-top:34px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:#fff}
.row{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:14px 20px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
@media(max-width:860px){.row{grid-template-columns:1fr;gap:4px}}
.row b{font-family:var(--display);color:var(--teal-deep)}
.row span{color:var(--ink-soft)}
pre{margin:26px 0 0;padding:18px 20px;background:#fff;
  border:1px solid var(--line);border-radius:var(--r);overflow:auto;
  font-size:14px;line-height:1.5}
.ftr{padding:40px 0 60px;border-top:1px solid var(--line);
  color:var(--ink-soft);font-size:15px}
.ftr a{color:var(--teal-deep)}
</style>

b>Модули</b> появится группа Isoliner3D - сцена, инструменты и «О программе».", "how.4.h": "4. Сцена", "how.4.p": "Нажать <b>Сцена Isoliner3D</b>. Повторное нажатие перечитывает слои в уже открытом окне.", "how.shot": "Слой «Тела выработок» после инструмента 2.24.", "how.eyebrow": "Установка", "how.h2": "Как поставить", "limits.eyebrow": "Пока так", "limits.h2": "Чего ждём от RustGIS", "limits.sub": "RustGIS хранит слои без высот и отдаёт расширениям координаты в градусах. Поэтому тела и линии с отметками видны только в сцене, а в проект ложится их контур в плане с объёмом и отметками в полях. Растры расширениям пока недоступны.", "title": "Isoliner3D для RustGIS · Информ++", "brand.sub": "расширение RustGIS", "ftr.line2": "ООО «Информ++»", "ftr.line3": "Программы бесплатные и открытые."}, "en": {"prod.pro": "Isoliner3D for QGIS", "prod.scene": "Isoliner Scene", "prod.rust": "Isoliner3D for RustGIS", "hero.eyebrow": "The Isoliner3D family · a RustGIS extension", "hero.h1": "Isoliner3D tools and the scene right in RustGIS", "hero.lead": "The extension opens the RustGIS project layers in the Isoliner3D 3D scene and adds the plugin tools to the Tools pane. Working bodies and borehole traces are computed as in QGIS and land in the project as a layer.", "cta.get": "Download the extension", "cta.man": "Manual", "cta.code": "Source code on GitHub", "cta.note": "Release 0.5.0 for RustGIS 0.6.0. The file isoliner3d-0.5.0.rgplugin, a manual in Russian and English. Apache 2.0.", "hero.shot": "The scene from the RustGIS project layers. On the right - tool 2.24 in the Tools pane.", "can.1.h": "A scene from the project layers", "can.1.p": "The Isoliner3D Scene button collects the visible layers into a scene package and opens the window with the same toolbar, settings and shadows as the QGIS plugin and Isoliner Scene.", "can.2.h": "The coordinate system of the map", "can.2.p": "The scene is built in metres of the RustGIS map system. It can be changed by an EPSG code in the Scene settings window. A map in degrees gives a UTM zone.", "can.3.h": "The plugin tools", "can.3.p": "Ten tools in the Tools pane - working and outline bodies, borehole traces and intervals, boolean operations, shell selection and statistics, fill to volume, 3D density, a bench report. Results chain from step to step, 3D results open in the scene.", "can.4.h": "One description for the whole family", "can.4.p": "The tools, the settings window and the manual are built from the plugin's shared files. A tool added to the plugin appears in RustGIS too.", "can.eyebrow": "Features", "can.h2": "What it does", "how.1.h": "1. The file", "how.1.p": "Download isoliner3d-0.5.0.rgplugin from the release page.", "how.2.h": "2. RustGIS", "how.2.p": "The <b>Plugins</b> tab, the <b>Install from file</b> button, choose the downloaded file.", "how.3.h": "3. The buttons", "how.3.p": "The <b>Plugins</b> tab gets an Isoliner3D group - the scene, the tools and About.", "how.4.h": "4. The scene", "how.4.p": "Press <b>Isoliner3D Scene</b>. A second press reloads the layers in the window already open.", "how.shot": "The Working bodies layer after tool 2.24.", "how.eyebrow": "Installation", "how.h2": "How to install", "limits.eyebrow": "For now", "limits.h2": "What we wait for in RustGIS", "limits.sub": "RustGIS keeps layers without heights and gives extensions coordinates in degrees. So bodies and lines with elevations are seen only in the scene, and the project gets their plan outline with the volume and elevations in fields. Rasters are not yet available to extensions.", "title": "Isoliner3D for RustGIS · Inform++", "brand.sub": "a RustGIS extension", "ftr.line2": "Inform++ LLC", "ftr.line3": "The programs are free and open source."}};

function apply(lang){
  var d = TEXTS[lang] || TEXTS.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n')];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  try { localStorage.setItem('isoliner3d-lang', lang); } catch (e) {}
}
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){ apply(b.getAttribute('data-lang')); });
});
// Выбор языка общий со страницей модуля: ключ тот же.
var saved = null;
try { saved = localStorage.getItem('isoliner3d-lang'); } catch (e) {}
apply(saved || 'ru');
</script>
