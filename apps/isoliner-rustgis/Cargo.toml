[package]
name = "isoliner-rustgis"
description = "Isoliner3D для RustGIS: расширение-процесс, сцена .i3dscene и инструменты 2.23, 2.24"
# своя версия: выпуски расширения - теги rustgis-v<версия>
version = "0.5.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
scene-format.workspace = true
tool-spec.workspace = true
tools.workspace = true
scene-app.workspace = true
scene-core.workspace = true
# общая основа расширений RustGIS линейки, отдельное хранилище. Правка
# крейта на месте - [patch] в .cargo/config.toml или путь вместо git.
rustgis-kit = { git = "https://github.com/Valery35/rustgis-kit", tag = "v0.1.9" }

[lints]
workspace = true
