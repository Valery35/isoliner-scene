<!DOCTYPE html>

     Copyright (C) 2026 ООО «Информ++». Лицензия Apache 2.0.

<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Isoliner Scene</title>
  <meta name="description" content="Сцена модуля QGIS Isoliner3D в браузере: пакет .i3dscene с камерой из QGIS.">
  <meta name="theme-color" content="#1b1b1b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Isoliner Scene">
  <link data-trunk rel="icon" href="favicon.png">
  <!-- Установка на телефон и работа без сети: манифест, значки,
       service worker (sw.js). Образец - страница PlanetX Lite. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link data-trunk rel="copy-file" href="manifest.webmanifest">
  <link data-trunk rel="copy-file" href="sw.js">
  <link data-trunk rel="copy-file" href="icon-192.png">
  <link data-trunk rel="copy-file" href="icon-512.png">
  <link data-trunk rel="copy-file" href="icon-maskable-512.png">
  <link data-trunk rel="copy-file" href="apple-touch-icon.png">
  <link data-trunk rel="rust" data-bin="isoliner-scene" data-wasm-opt="0">
  <style>
    /* светлая тема по умолчанию, как у окна сцены */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f8f8f6; }
    #scene { width: 100%; height: 100%; display: block; touch-action: none; }
    #report { position: fixed; left: 8px; bottom: 8px; margin: 0; color: #f88; font: 12px monospace; white-space: pre-wrap; }
    /* Значок загрузки: виден, пока скачивается программа страницы.
       Его убирает web.rs после запуска. */
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f8f8f6; color: #44505a; font: 15px system-ui, sans-serif; }
    #loading .ring { width: 44px; height: 44px; border: 4px solid #d6dbe0; border-top-color: #e08a6f; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loading .ring { animation: none; } }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="loading"><div class="ring"></div><div id="loading-text">Isoliner Scene</div></div>
  <pre id="report"></pre>
  <script>
    // Подпись значка на языке браузера: русский или английский.
    document.getElementById('loading-text').textContent =
      (navigator.language || '').startsWith('ru') ? 'Isoliner Scene загружается…' : 'Isoliner Scene is loading…';
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch((e) => console.log('Isoliner Scene: service worker', e));
    }
  </script>
</body>
</html>
