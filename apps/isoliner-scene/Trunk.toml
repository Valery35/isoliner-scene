# Страница в браузере: `trunk build --release` в этой папке. Образец -
# apps/planetx-web PlanetX Lite. На сайте программа живёт в папке app/,
# главная страница сайта - site/index.html.

[build]
target = "index.html"
dist = "../../dist/app"
# Trunk ничего не скачивает: wasm-bindgen стоит из исходников crates.io.
offline = true

[tools]
wasm_bindgen = "0.2.129"
